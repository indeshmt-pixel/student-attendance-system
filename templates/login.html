<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Attendance System - Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-page"><section class="login-box"><div class="login-logo"><div class="brand-mark">SA</div><h1>Student Attendance System</h1><p>Secure attendance management</p></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{ category }}">{{ msg }}</div>{% endfor %}{% endwith %}<form class="login-form" method="post"><div><label>Username</label><input name="username" autocomplete="username" required placeholder="Enter username"></div><div><label>Password</label><input type="password" name="password" autocomplete="current-password" required placeholder="Enter password"></div><button class="btn" type="submit">Login</button></form><div class="hint">Default login: admin / admin123</div></section></body></html>
